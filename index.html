<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Exam Studio 智慧題庫</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#16243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#12213a;color:white;padding:20px max(20px,calc((100% - 1100px)/2))}header h1{margin:0;font-size:24px}header small{color:#bed0e8}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:330px 1fr;gap:20px}.panel{background:white;border:1px solid #e1e7ef;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #1426420a}h2{font-size:19px;margin:0 0 16px}label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}input,select,textarea{width:100%;border:1px solid #cdd7e5;border-radius:9px;padding:10px;font:inherit;background:white}textarea{min-height:70px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks label{font-size:12px;font-weight:500;margin:0;display:flex;gap:5px;align-items:center}.checks input{width:auto}.btn{border:0;border-radius:9px;background:#2254bb;color:white;padding:10px 14px;cursor:pointer;font-weight:700}.btn.secondary{background:#e8eef9;color:#203b6a}.btn.danger{background:#ffeded;color:#a32626}.btn:disabled{opacity:.5;cursor:wait}.actions{display:flex;flex-wrap:wrap;gap:8px}.muted{color:#64748b;font-size:13px}.question{border:1px solid #dbe3ee;border-radius:12px;padding:17px;margin:14px 0}.question h3{font-size:15px;line-height:1.8;margin:0 0 8px;white-space:pre-wrap}.question p{white-space:pre-wrap;line-height:1.75}.options{display:grid;gap:8px;margin:12px 0}.option{display:flex;gap:8px;align-items:start;font-size:14px}.option input{width:auto;margin-top:4px}.pill{display:inline-block;background:#edf3ff;color:#2853a2;padding:3px 8px;border-radius:20px;font-size:11px;margin-bottom:10px}.figure{max-width:100%;overflow:auto;margin:12px 0}.figure svg{max-width:100%;height:auto}.score{font-size:23px;font-weight:800;color:#2254bb}.status{padding:10px 12px;background:#eef4ff;border-radius:10px;font-size:13px;margin:12px 0;white-space:pre-wrap}.hide{display:none}.paper{background:white}.paper-head{text-align:center;border-bottom:2px solid #222;padding-bottom:12px;margin-bottom:22px}.paper-head h1{font-size:23px}.paper-item{break-inside:avoid;margin:20px 0}.paper-item p{line-height:1.8;white-space:pre-wrap}.paper-figure svg{max-width:420px;width:100%}.answer-key{page-break-before:always}.answer-key p{line-height:1.8}@media(max-width:800px){.grid{grid-template-columns:1fr}}@media print{body{background:white;color:black}header,.wrap,.no-print{display:none!important}#printArea{display:block!important;padding:0 12mm;font-size:12pt}.paper-head{margin-top:5mm}@page{size:A4;margin:14mm}}
</style></head><body><header><h1>AI Exam Studio</h1><small>全科智慧題庫 · 自由選題 · 正式組卷</small></header><div class="wrap"><div class="grid"><aside><div class="panel"><h2>① 命題設定</h2><label>科目</label><select id="subject"><option>國文</option><option selected>英文</option><option>數學</option><option>生物</option><option>理化</option><option>地球科學</option><option>地理</option><option>歷史</option><option>公民</option></select><label>考試範圍（免上傳教材）</label><textarea id="scope">國三上學期第二次段考</textarea><label>考試名稱</label><input id="examTitle" value="國中素養評量試卷"><label>難度</label><select id="difficulty"><option>基礎</option><option>中等</option><option selected>中上</option><option>困難</option><option>混合難度</option></select><label>題數（每次最多 20 題，避免輸出截斷）</label><input id="count" type="number" min="1" max="20" value="10"><label>題型（可複選）</label><div class="checks" id="types"></div><label>圖表比例</label><select id="figureRate"><option value="0">不需要</option><option value="0.3" selected>約 30%</option><option value="0.6">約 60%</option></select><p class="muted">安全模式：已停用瀏覽器端 API 金鑰輸入及 AI 連線。可載入示範題、手動新增、編輯與列印。</p><div class="actions"><button class="btn secondary" id="sample">載入示範題</button></div><div class="status" id="status">請設定題型與範圍，再開始生成。</div></div></aside><main><div class="panel"><h2>② 題目挑選與編輯</h2><p class="muted">題目可直接修改、刪除、調整順序；答案及詳解另行保留。生成後請自行核對重要事實與圖表。</p><div class="actions"><button class="btn secondary" id="add">＋ 手動新增</button><button class="btn secondary" id="save">儲存至本機</button><button class="btn secondary" id="load">讀取本機題庫</button><button class="btn secondary" id="exportJson">匯出 JSON</button><label style="margin:0"><span class="btn secondary" style="display:inline-block">匯入 JSON</span><input type="file" id="importJson" accept="application/json" hidden></label></div><div id="questions"></div></div><div class="panel"><h2>③ 組卷與作答</h2><div class="actions"><button class="btn" id="preview">預覽正式考卷</button><button class="btn secondary" id="print">列印 / 另存 PDF</button><button class="btn secondary" id="grade">批改目前作答</button><button class="btn secondary" id="toggleAnswers">顯示／隱藏詳解</button></div><p class="muted">正式考卷包含題目、答案卷及詳解。可透過瀏覽器列印選擇「另存為 PDF」。</p><div id="result"></div></div></main></div></div><div id="printArea" class="hide paper"></div><script>
'use strict';const $=id=>document.getElementById(id);const typeNames=['單選題','複選題','閱讀測驗','素養題組','文法克漏字','字彙克漏字','圖表判讀','地圖判讀','情境應用','跨單元整合','非選擇題'];$('types').innerHTML=typeNames.map((t,i)=>`<label><input type="checkbox" value="${t}" ${[0,2,3,6].includes(i)?'checked':''}>${t}</label>`).join('');let questions=[];let reveal=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const status=s=>$('status').textContent=s;const selectedTypes=()=>[...document.querySelectorAll('#types input:checked')].map(x=>x.value);
function validFigure(f){if(!f||typeof f!=='object')return null;if(f.kind==='bar'&&Array.isArray(f.labels)&&Array.isArray(f.values)&&f.labels.length===f.values.length&&f.labels.length<=10&&f.values.every(v=>Number.isFinite(Number(v))&&Number(v)>=0))return {kind:'bar',labels:f.labels.map(String),values:f.values.map(Number),title:String(f.title||'統計圖')};if(f.kind==='line'&&Array.isArray(f.labels)&&Array.isArray(f.values)&&f.labels.length===f.values.length&&f.labels.length<=12&&f.values.every(v=>Number.isFinite(Number(v))))return {kind:'line',labels:f.labels.map(String),values:f.values.map(Number),title:String(f.title||'折線圖')};return null}
function svgFigure(f){f=validFigure(f);if(!f)return '';const W=520,H=270,left=56,top=44,w=430,h=170;const max=Math.max(...f.values,1),min=f.kind==='line'?Math.min(0,...f.values):0,range=Math.max(max-min,1);const y=v=>top+h-(v-min)/range*h;const x=i=>left+(i+.5)*w/f.labels.length;let body=`<rect width="520" height="270" fill="white"/><text x="260" y="23" font-size="16" text-anchor="middle" fill="#172b4d">${esc(f.title)}</text><path d="M${left} ${top}V${top+h}H${left+w}" fill="none" stroke="#334155"/>`;for(let i=0;i<=4;i++){const v=min+range*i/4,yy=y(v);body+=`<line x1="${left}" y1="${yy}" x2="${left+w}" y2="${yy}" stroke="#e2e8f0"/><text x="${left-7}" y="${yy+4}" text-anchor="end" font-size="11">${Number(v.toFixed(1))}</text>`}if(f.kind==='bar'){f.values.forEach((v,i)=>{const bw=w/f.values.length*.6;body+=`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(0,top+h-y(v))}" fill="#3b72c6"/>`})}else{body+=`<polyline points="${f.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" stroke="#2563eb" stroke-width="3" fill="none"/>`;f.values.forEach((v,i)=>body+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#2563eb"/>`)}f.labels.forEach((v,i)=>body+=`<text x="${x(i)}" y="${top+h+20}" font-size="10" text-anchor="middle">${esc(v.slice(0,9))}</text>`);return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(f.title)}">${body}</svg>`}
function normalize(q){return {type:String(q.type||'單選題'),stem:String(q.stem||''),passage:String(q.passage||''),options:Array.isArray(q.options)?q.options.slice(0,6).map(String):[],answer:String(q.answer||''),explanation:String(q.explanation||''),figure:validFigure(q.figure),points:Number(q.points)||2}}
function render(){const root=$('questions');root.innerHTML=questions.length?'':'<p class="muted">目前沒有題目。可先載入示範題，或連接 AI 命題。</p>';questions.forEach((q,i)=>{const d=document.createElement('div');d.className='question';d.innerHTML=`<span class="pill">第 ${i+1} 題 · ${esc(q.type)}</span><h3>${esc(q.stem)}</h3>${q.passage?`<p>${esc(q.passage)}</p>`:''}<div class="figure">${svgFigure(q.figure)}</div><div class="options">${q.options.map((o,j)=>`<label class="option"><input type="${q.type==='複選題'?'checkbox':'radio'}" name="ans${i}" value="${'ABCDEF'[j]}"><span>(${'ABCDEF'[j]}) ${esc(o)}</span></label>`).join('')}</div>${q.options.length?'':'<textarea placeholder="請在此作答" class="freeAnswer"></textarea>'}<div class="actions no-print"><button class="btn secondary edit">編輯</button><button class="btn secondary up">↑</button><button class="btn secondary down">↓</button><button class="btn danger del">刪除</button></div><div class="muted solution ${reveal?'':'hide'}" style="margin-top:12px">答案：${esc(q.answer)}<p>解析：${esc(q.explanation)}</p></div>`;root.append(d);d.querySelector('.edit').onclick=()=>edit(i);d.querySelector('.up').onclick=()=>move(i,-1);d.querySelector('.down').onclick=()=>move(i,1);d.querySelector('.del').onclick=()=>{questions.splice(i,1);render()}})}
function move(i,delta){const j=i+delta;if(j<0||j>=questions.length)return;[questions[i],questions[j]]=[questions[j],questions[i]];render()}
function edit(i){const q=questions[i];const stem=prompt('修改題幹',q.stem);if(stem===null)return;const passage=prompt('修改閱讀材料（可留空）',q.passage);if(passage===null)return;const opts=prompt('選項（每行一個；非選擇題可留空）',q.options.join('\n'));if(opts===null)return;const ans=prompt('標準答案（選擇題填 A/B/C/D，複選題如 AC）',q.answer);if(ans===null)return;const exp=prompt('詳解',q.explanation);if(exp===null)return;questions[i]={...q,stem,passage,options:opts?opts.split('\n'):[],answer:ans,explanation:exp};render()}
$('add').onclick=()=>{questions.push(normalize({stem:'請編輯這道題目',options:['選項一','選項二','選項三','選項四'],answer:'A',explanation:'請填入詳解'}));render()};$('toggleAnswers').onclick=()=>{reveal=!reveal;render()};
$('sample').onclick=()=>{questions=[{type:'圖表判讀',stem:'根據下圖，哪個月份的降雨量最高？',options:['一月','二月','三月','四月'],answer:'C',explanation:'三月的長條最高，因此答案為 C。',figure:{kind:'bar',title:'某地月降雨量（示意資料，毫米）',labels:['一月','二月','三月','四月'],values:[40,65,120,80]}},{type:'閱讀測驗',stem:'依據短文，為什麼學生決定改搭火車？',passage:'Mia usually goes to school by bus. One morning, the road was closed because of construction. She decided to take the train instead.',options:['The bus was too expensive.','The road was closed.','She missed the train.','The school was closed.'],answer:'B',explanation:'短文指出道路因施工而封閉，因此改搭火車。'},{type:'單選題',stem:'下列何者最適合用來描述市場價格受到供給與需求共同影響的現象？',options:['價格完全固定','需求增加且供給不變時，價格可能上升','供給減少時價格一定下降','需求變動不影響價格'],answer:'B',explanation:'其他條件不變時，需求增加通常會使均衡價格上升。'}].map(normalize);render();status('已載入 3 道示範題。示範題不是 AI 即時生成。')};
$('save').onclick=()=>{try{localStorage.setItem('ai_exam_questions_v1',JSON.stringify(questions));status('已儲存在這個瀏覽器。清除瀏覽器資料可能導致題目消失。')}catch(e){status('儲存失敗：'+e.message)}};$('load').onclick=()=>{try{questions=JSON.parse(localStorage.getItem('ai_exam_questions_v1')||'[]').map(normalize);render();status('已讀取 '+questions.length+' 題')}catch(e){status('讀取失敗：'+e.message)}};
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('exportJson').onclick=()=>download('exam-questions.json',JSON.stringify(questions,null,2),'application/json');$('importJson').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error('JSON 頂層必須是題目陣列');questions=data.slice(0,300).map(normalize);render();status('匯入完成：'+questions.length+' 題')}catch(err){status('匯入失敗：'+err.message)}};
function paper(){const title=esc($('examTitle').value),scope=esc($('scope').value);$('printArea').innerHTML=`<div class="paper-head"><h1>${title}</h1><p>科目：${esc($('subject').value)}　範圍：${scope}　題數：${questions.length}　總分：${questions.reduce((s,q)=>s+q.points,0)} 分</p><p>班級：________　座號：________　姓名：________　得分：________</p></div>`+questions.map((q,i)=>`<section class="paper-item"><b>${i+1}. [${q.points} 分] ${esc(q.stem)}</b>${q.passage?`<p>${esc(q.passage)}</p>`:''}<div class="paper-figure">${svgFigure(q.figure)}</div>${q.options.map((o,j)=>`<p>(${'ABCDEF'[j]}) ${esc(o)}</p>`).join('')}${!q.options.length?'<p>作答：________________________________________________</p>':''}</section>`).join('')+`<section class="answer-key"><h2>答案與解析（教師用）</h2>${questions.map((q,i)=>`<p><b>${i+1}. ${esc(q.answer)}</b>　${esc(q.explanation)}</p>`).join('')}</section>`;return $('printArea').innerHTML}
$('preview').onclick=()=>{if(!questions.length)return status('請先產生題目');paper();const w=window.open('','_blank');if(!w)return status('瀏覽器阻擋了預覽視窗，請允許彈出視窗');w.document.write('<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>考卷預覽</title><style>body{max-width:800px;margin:35px auto;padding:20px;font:16px/1.7 system-ui}section{break-inside:avoid;margin:24px 0}.paper-head{text-align:center;border-bottom:2px solid}.paper-figure svg{max-width:450px}.answer-key{break-before:page}@media print{@page{size:A4;margin:15mm}}</style>'+paper()+'</html>');w.document.close()};$('print').onclick=()=>{if(!questions.length)return status('請先產生題目');paper();window.print()};$('grade').onclick=()=>{if(!questions.length)return;let correct=0,graded=0;[...$('questions').children].forEach((d,i)=>{const q=questions[i];if(!q.options.length)return;graded++;const answers=[...d.querySelectorAll('input:checked')].map(x=>x.value).sort().join('');if(answers===q.answer.toUpperCase().replace(/[^A-F]/g,'').split('').sort().join(''))correct++});$('result').innerHTML=`<p class="score">${correct} / ${graded} 題正確</p><p class="muted">僅自動批改有選項的題目；非選擇題請人工檢查。</p>`};
render();status('已新增 '+parsed.length+' 題，共 '+questions.length+' 題。請檢查答案、圖表及課綱範圍。')}catch(e){status('生成失敗：'+e.message+'\n可嘗試減少題數、確認模型名稱或檢查免費額度。')}finally{btn.disabled=false}};render();
</script></body></html>
